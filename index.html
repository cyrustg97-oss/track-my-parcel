<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
<title>Track My Parcel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#182536;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid #e5e9ee;padding:23px 7%;font-weight:700;font-size:20px;letter-spacing:-.5px}main{width:min(580px,calc(100% - 40px));margin:100px auto 50px}h1{font-size:36px;line-height:1.2;letter-spacing:-1px;margin:0 0 12px}p{color:#657182;margin:0 0 26px}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}form{display:flex;gap:10px}input{min-width:0;flex:1;background:#fff;border:1px solid #b8c3cf;border-radius:6px;padding:15px;font:15px ui-monospace,monospace;color:#182536}button{border:0;border-radius:6px;background:#193e68;color:white;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:15px 23px;cursor:pointer;min-height:48px}button:hover{background:#102c4b}:focus-visible{outline:3px solid #78a1d2;outline-offset:3px}#message{font-size:14px;margin-top:15px;color:#a33232}article{margin-top:26px;padding:24px;background:#fff;border:1px solid #e0e5ec;border-radius:8px;display:flex;gap:24px;align-items:center}img{width:110px;height:130px;object-fit:contain;flex-shrink:0}h2{font-size:17px;margin:0 0 5px}.number{font:11px ui-monospace,monospace;color:#667487;overflow-wrap:anywhere}.eta-label{font-size:12px;color:#667487;margin-top:18px}.eta{font-size:18px;font-weight:650;margin-top:3px}footer{font-size:12px;color:#737e8b;margin-top:40px;border-top:1px solid #e0e5ec;padding-top:18px}[hidden]{display:none!important}@media(max-width:480px){main{margin-top:65px}h1{font-size:31px}article{padding:18px;gap:16px}img{width:85px;height:110px}.eta{font-size:16px}button{padding:15px 18px}input{font-size:12px;padding:14px 10px}}
</style>
<script src="app.js" defer></script>
</head>
<body>
<header>Track My Parcel</header>
<main>
<h1>Track your parcel</h1>
<p>Enter your tracking number to see your delivery estimate.</p>
<label for="tracking-number">Tracking number</label>
<form id="tracking-form"><input id="tracking-number" name="tracking" placeholder="Enter tracking number" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" required><button type="submit">Track</button></form>
<p id="message" role="status" aria-live="polite"></p>
<article id="result" hidden aria-label="Parcel details" aria-live="polite">
<img id="photo" alt="YSL bag with crystal-style embellishments">
<div><h2>YSL bag</h2><div class="number">YSL-AU-20261117-48291</div><div class="eta-label">Estimated delivery</div><div class="eta">Monday, 23 November 2026</div></div>
</article>
<footer>Delivery information is provided by the sender, not verified by a courier. Estimated dates are not guaranteed.</footer>
</main>
</body></html>
